<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>SAAKSHI record check</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF3F5; --surface: #FFFFFF; --ink: #0E2233; --muted: #566876; --line: #CFD9DF;
    --cold: #2F7FA6; --cold-soft: rgba(47,127,166,.16); --band: rgba(30,122,76,.10);
    --ok: #1E7A4C; --bad: #B3261E; --warn: #9A5A00; --lock: #3D5566;
    --font: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B1823; --surface: #11222F; --ink: #E3ECF1; --muted: #93A6B4; --line: #23394A;
      --cold: #6CB4D8; --cold-soft: rgba(108,180,216,.18); --band: rgba(91,197,142,.12);
      --ok: #5BC58E; --bad: #F07B70; --warn: #E8A94A; --lock: #A9BCC9;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B1823; --surface: #11222F; --ink: #E3ECF1; --muted: #93A6B4; --line: #23394A;
    --cold: #6CB4D8; --cold-soft: rgba(108,180,216,.18); --band: rgba(91,197,142,.12);
    --ok: #5BC58E; --bad: #F07B70; --warn: #E8A94A; --lock: #A9BCC9;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font);
    font-size: 17px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
  main { max-width: 680px; margin: 0 auto; padding: 28px 20px 56px; }
  a { color: var(--cold); text-underline-offset: 2px; }
  a:focus-visible, button:focus-visible, select:focus-visible, summary:focus-visible {
    outline: 3px solid var(--cold); outline-offset: 2px; border-radius: 4px; }

  /* the verdict: seal + statement */
  .verdict { display: grid; grid-template-columns: 116px 1fr; gap: 20px; align-items: center; margin-bottom: 28px; }
  .seal { width: 116px; height: 116px; color: var(--muted); }
  .seal.stamp { animation: stamp .45s cubic-bezier(.2,.9,.3,1.3) both; }
  @keyframes stamp { from { transform: scale(1.18) rotate(-8deg); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .seal.stamp { animation: none; } .spin { animation: none !important; } }
  .seal.genuine { color: var(--ok); } .seal.tampered { color: var(--bad); }
  .seal.partly, .seal.unanchored { color: var(--warn); } .seal.locked { color: var(--lock); }
  .spin { transform-origin: 58px 58px; animation: turn 6s linear infinite; }
  @keyframes turn { to { transform: rotate(360deg); } }
  h1 { font-stretch: 112%; font-weight: 780; font-size: clamp(30px, 7vw, 42px); line-height: 1.05;
    letter-spacing: -.01em; margin: 0 0 8px; }
  .lede { margin: 0; color: var(--muted); max-width: 46ch; }
  .lede strong { color: var(--ink); font-weight: 650; }
  @media (max-width: 420px) { .verdict { grid-template-columns: 1fr; } .seal { width: 96px; height: 96px; } }

  section { margin-top: 34px; }
  h2 { font-stretch: 100%; font-size: 19px; font-weight: 700; margin: 0 0 10px; }
  .muted { color: var(--muted); }

  /* trip readings */
  .trip { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 12px; }
  .when { margin: 0 0 14px; color: var(--muted); }
  .chart { position: relative; margin: 6px 0 2px; }
  .chart svg { display: block; width: 100%; height: 190px; overflow: visible; }
  .chart.small svg { height: 110px; }
  .chart .ylab { position: absolute; left: 0; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums;
    background: var(--surface); padding: 0 4px 0 0; line-height: 1; }
  .chart .xlab { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 6px; }
  .chart-title { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 10px; }
  .chart-title b { font-weight: 650; }
  .figs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px 14px; margin: 16px 0 6px;
    padding-top: 14px; border-top: 1px solid var(--line); }
  .fig { padding: 6px 0; }
  .fig .v { font-stretch: 88%; font-weight: 700; font-size: 24px; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .fig .k { font-size: 14px; color: var(--muted); }
  .fig.alert .v { color: var(--warn); }
  @media (max-width: 420px) { .figs { grid-template-columns: repeat(2, 1fr); } }

  /* checks performed on this phone: a real sequence, so it is numbered */
  ol.checks { list-style: none; padding: 0; margin: 0; counter-reset: c; }
  ol.checks li { position: relative; padding: 10px 0 10px 38px; border-top: 1px solid var(--line); }
  ol.checks li:first-child { border-top: 0; }
  ol.checks li::before { counter-increment: c; content: counter(c); position: absolute; left: 0; top: 10px;
    width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700;
    border: 1.5px solid var(--line); color: var(--muted); }
  ol.checks li.ok::before { content: "✓"; border-color: var(--ok); color: var(--ok); }
  ol.checks li.bad::before { content: "✕"; border-color: var(--bad); color: var(--bad); }
  ol.checks li.warn::before { content: "!"; border-color: var(--warn); color: var(--warn); }
  ol.checks li.info::before { content: "i"; }
  ol.checks li.bad { color: var(--bad); font-weight: 600; }

  .events { margin: 0; padding-left: 20px; }
  .events li { margin: 4px 0; }
  .events .w { color: var(--warn); font-weight: 600; }

  .progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin: 14px 0 0; }
  .progress > i { display: block; height: 100%; width: 0; background: var(--cold); transition: width .2s; }

  details { margin-top: 34px; border-top: 1px solid var(--line); padding-top: 14px; }
  summary { cursor: pointer; font-weight: 650; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 14px 0 0; font-size: 15px; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  .hash { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .note { font-size: 15px; color: var(--muted); max-width: 60ch; }
  select { font: inherit; font-size: 15px; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 8px; }
  footer { margin-top: 40px; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<main id="app" aria-live="polite">
  <div class="verdict">
    <svg class="seal" viewBox="0 0 116 116" aria-hidden="true"><g class="spin"><circle cx="58" cy="58" r="52" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 7"/></g></svg>
    <div><h1>Checking record</h1><p class="lede">Loading the published record…</p></div>
  </div>
</main>
<noscript><main><h1>JavaScript is needed</h1><p>This page checks the record on your device, which needs JavaScript.</p></main></noscript>
<script src="core.js"></script>
<script src="ui.js"></script>
</body>
</html>
